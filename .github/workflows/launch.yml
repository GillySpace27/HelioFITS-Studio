name: launch

# Starts the whole application on Linux and Windows and looks at it.
#
# checks.yml proves the libraries load; nothing had ever run the application itself off a Mac.
# This job does what a user does: starts it through the launcher the zip ships (run.sh, run.bat),
# opens a bundled image with -load, waits for the renderer, and takes a screenshot of the screen.
#
# Pass means: the main window came up, a graphics context was created, nothing went uncaught, the
# process was still alive, and the screenshot holds the drawn image (extra/launch-pixels.py counts
# its sun-coloured pixels). The screenshot is uploaded either way.
#
# Neither runner has a GPU: Linux draws through Mesa's software OpenGL under Xvfb, Windows through
# Microsoft's software renderer. A pass there is necessary for a real
# machine to work, not sufficient.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: extra/test/data/syn_AIA_171_2026-01-12T00-00-00_f_V3.fits

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Mesa supplies the software OpenGL that ANGLE's Linux backend draws through.
      - uses: ./.github/actions/setup-hfstudio
        with:
          natives: 'false'
          linux-packages: xvfb imagemagick libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 python3-pil python3-jsonschema

      - name: Build
        run: ant jar

      - name: Launch and screenshot
        run: xvfb-run -a -s "-screen 0 1600x1000x24" extra/launch-shot.sh linux ./run.sh -load "$PWD/$IMAGE"

      - name: Judge
        if: always()
        run: extra/launch-judge.sh app-linux.log alive-linux.txt app-linux.out

      - name: Did the image draw
        run: python3 extra/launch-pixels.py shot-linux.png 1500

      - name: Export a PNG from the command line
        run: |
          export JAVA_TOOL_OPTIONS="-Duser.home=$RUNNER_TEMP/home-export"
          xvfb-run -a -s "-screen 0 1600x1000x24" ./run.sh --export png --out "$RUNNER_TEMP/export.png" -load "$PWD/$IMAGE"
          file "$RUNNER_TEMP/export.png"
          grep -c hfstudio "$RUNNER_TEMP/export.png"

      # The processing record (hfrecord 1.0) beside the export: it must pass the schema and hash the
      # file, and its native part must rebuild the same scene. The second export loads only the
      # record's scene with -state; the two pictures are compared with a tolerance, not byte for byte.
      - name: Rebuild the export from its processing record
        run: |
          export JAVA_TOOL_OPTIONS="-Duser.home=$RUNNER_TEMP/home-export"
          ls -l "$RUNNER_TEMP/export.png.hfrec.json"
          python3 extra/test/hfrecord_roundtrip.py prepare "$RUNNER_TEMP/export.png" "$RUNNER_TEMP/home-export" "$RUNNER_TEMP/rebuild.jhv"
          python3 extra/test/hfrecord_roundtrip.py embedded "$RUNNER_TEMP/export.png"
          xvfb-run -a -s "-screen 0 1600x1000x24" ./run.sh --export png --out "$RUNNER_TEMP/rebuild.png" -state "$RUNNER_TEMP/rebuild.jhv"
          python3 extra/test/hfrecord_roundtrip.py compare "$RUNNER_TEMP/export.png" "$RUNNER_TEMP/rebuild.png"

      - name: Show the round trip's inputs when it fails
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/rebuild.jhv" "$RUNNER_TEMP/rebuild.png.hfrec.json"; do
            echo "== $f"; cat "$f" || true; echo
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: launch-linux
          path: |
            shot-linux.png
            app-linux.log
            app-linux.out
            ${{ runner.temp }}/export.png.hfrec.json
            ${{ runner.temp }}/rebuild.png.hfrec.json

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-hfstudio
        with:
          natives: 'false'
          pillow: 'true'

      # The runner's screen is 1024x768, where the sidebars leave the image a strip 30 pixels
      # wide: it drew, but too small to judge. ChangeDisplaySettings is the only way in on a
      # machine with no display settings UI to click.
      - name: Raise the screen to 1920x1080
        shell: pwsh
        run: ./extra/ci/set-resolution.ps1

      - name: Build
        shell: bash
        run: ant jar

      - name: Launch and screenshot
        shell: bash
        run: extra/launch-shot.sh windows cmd //c "run.bat -load $(cygpath -w "$PWD/$IMAGE")"

      - name: Judge
        if: always()
        shell: bash
        run: extra/launch-judge.sh app-windows.log alive-windows.txt app-windows.out

      - name: Did the image draw
        shell: bash
        run: python extra/launch-pixels.py shot-windows.png 1500

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: launch-windows
          path: |
            shot-windows.png
            app-windows.log
            app-windows.out
