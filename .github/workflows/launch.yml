name: launch

# Starts the whole application on Linux and Windows and looks at it.
#
# checks.yml proves the libraries load; nothing had ever run the application itself off a Mac.
# This job does what a user does: starts it through the launcher the zip ships (run.sh, run.bat),
# opens a bundled image with -load, waits for the renderer, and takes a screenshot of the screen.
#
# Pass means: the main window came up, a graphics context was created, nothing went uncaught, the
# process was still alive, and the screenshot holds the drawn image (extra/launch-pixels.py counts
# its sun-coloured pixels). The screenshot is uploaded either way.
#
# Neither runner has a GPU: Linux draws through Mesa's software OpenGL under Xvfb, Windows through
# Microsoft's software renderer. A pass there is necessary for a real
# machine to work, not sufficient.

on:
  push:
    branches: ['ci/launch-smoke']
  workflow_dispatch:

env:
  IMAGE: extra/test/data/syn_AIA_171_2026-01-12T00-00-00_f_V3.fits
  WAIT_FOR_GL: 180   # seconds to wait for the graphics context before calling it a failure
  SETTLE: 25         # seconds after that for the image to load and draw

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Mesa supplies the software OpenGL that ANGLE's Linux backend draws through.
      - name: Install ant, a virtual display, software OpenGL and a screenshot tool
        run: |
          sudo apt-get update
          sudo apt-get install -y ant xvfb imagemagick libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 python3-pil

      - name: Build
        run: ant jar

      - name: Launch and screenshot
        run: |
          export HOME_DIR="$RUNNER_TEMP/home"; mkdir -p "$HOME_DIR"
          # A fresh home, so no earlier session is restored and the log is this run's alone.
          export JAVA_TOOL_OPTIONS="-Duser.home=$HOME_DIR"
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            ./run.sh -load "$PWD/$IMAGE" > app.out 2>&1 &
            APP=$!
            for i in $(seq 1 $WAIT_FOR_GL); do
              grep -qs "OpenGL context" "$HOME_DIR"/HFStudio/Logs/*.log && break
              kill -0 $APP 2>/dev/null || break
              sleep 1
            done
            sleep $SETTLE
            import -window root shot-linux.png || true
            if kill -0 $APP 2>/dev/null; then echo alive > alive.txt; kill $APP; fi
            true'
          cp "$HOME_DIR"/HFStudio/Logs/*.log app-linux.log 2>/dev/null || true

      - name: Judge
        if: always()
        run: extra/launch-judge.sh app-linux.log alive.txt app.out

      # Xvfb's root window is black and the app's chrome is purple and grey, so the whole screen is
      # fair to count here; measured at 8529 drawn pixels against 162 from the interface.
      - name: Did the image draw
        run: python3 extra/launch-pixels.py shot-linux.png 1500

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-linux
          path: |
            shot-linux.png
            app-linux.log
            app.out

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install ant and Pillow
        run: |
          choco install -y ant --no-progress
          python -m pip install --quiet pillow

      # The runner's screen is 1024x768, where the sidebars leave the image a strip 30 pixels
      # wide: it drew, but too small to judge. ChangeDisplaySettings is the only way in on a
      # machine with no display settings UI to click.
      - name: Raise the screen to 1920x1080
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class Res {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency,
                         dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2,
                         dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll")] public static extern int EnumDisplaySettings(string d, int m, ref DEVMODE dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int f);
          }
          "@
          $dm = New-Object Res+DEVMODE
          $dm.dmSize = [Runtime.InteropServices.Marshal]::SizeOf($dm)
          [Res]::EnumDisplaySettings($null, -1, [ref]$dm) | Out-Null
          $dm.dmPelsWidth = 1920; $dm.dmPelsHeight = 1080; $dm.dmFields = 0x180000
          "ChangeDisplaySettings returned $([Res]::ChangeDisplaySettings([ref]$dm, 0)) (0 is success)"

      - name: Build
        shell: bash
        run: ant jar

      # Git Bash for the waiting, cmd for run.bat itself, PowerShell only for the screenshot.
      - name: Launch and screenshot
        shell: bash
        run: |
          HOME_DIR="$(cygpath -w "$RUNNER_TEMP")\\home"; mkdir -p "$(cygpath -u "$HOME_DIR")"
          export JAVA_TOOL_OPTIONS="-Duser.home=$HOME_DIR"
          LOGS="$(cygpath -u "$HOME_DIR")/HFStudio/Logs"
          cmd //c "run.bat -load $(cygpath -w "$PWD/$IMAGE")" > app.out 2>&1 &
          APP=$!
          for i in $(seq 1 $WAIT_FOR_GL); do
            grep -qs "OpenGL context" "$LOGS"/*.log && break
            tasklist //FI "IMAGENAME eq java.exe" | grep -qi java.exe || break
            sleep 1
          done
          sleep $SETTLE
          # The app window only: the desktop behind it (wallpaper, icons) measured 6592 warm
          # pixels, enough to pass the pixel check with nothing drawn at all.
          powershell -NoProfile -Command '
            Add-Type -AssemblyName System.Drawing
            Add-Type "using System; using System.Runtime.InteropServices;
              public class W { [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
                [DllImport(""user32.dll"")] public static extern bool GetWindowRect(IntPtr h, out R r); }"
            $p = Get-Process java | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
            $r = New-Object W+R; [W]::GetWindowRect($p.MainWindowHandle, [ref]$r) | Out-Null
            $w = $r.Rt - $r.L; $h = $r.B - $r.T; "app window ${w}x${h} at $($r.L),$($r.T)"
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
            $bmp.Save("shot-windows.png")' || true
          tasklist //FI "IMAGENAME eq java.exe" | grep -qi java.exe && echo alive > alive.txt
          taskkill //F //IM java.exe > /dev/null 2>&1 || true
          cp "$LOGS"/*.log app-windows.log 2>/dev/null || true

      - name: Judge
        if: always()
        shell: bash
        run: extra/launch-judge.sh app-windows.log alive.txt app.out

      - name: Did the image draw
        shell: bash
        run: python extra/launch-pixels.py shot-windows.png 1500

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-windows
          path: |
            shot-windows.png
            app-windows.log
            app.out
