name: package

# Builds the self-contained Windows and Linux packages (release/package-app.sh): the application
# with its own Java, which is what the Mac dmg already is. Each package is then started the way a
# user would start it and judged exactly as launch.yml judges the zip: main window, graphics
# context, nothing uncaught, the JPEG 2000 decoder loaded, still running, and the image drawn.
# A JPEG 2000 file is opened alongside the FITS one, since the decoder is the native most likely
# to be missing on a user's machine.
#
# On every push the packages are only kept as build artifacts. When a release is published
# (deploy_release.sh publish), this runs on the release's tag and the attach job puts both
# packages on that release, but only if every check on both passed: a platform that fails has no
# file on the release, so its download button cannot light up whatever the page says.

on:
  push:
    branches: [master]
  release:
    types: [published]
  # A manual run with a release name attaches to that release too. Meant for trying the attach step
  # against a draft release, which is private and never fires "published".
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to attach the packages to (e.g. a draft to test with). Empty: build and check only."
        required: false
        default: ""

env:
  FITS: extra/test/data/syn_AIA_171_2026-01-12T00-00-00_f_V3.fits
  JP2: extra/test/j2k/lasco-c2-256.jp2

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, but only this commit's files: the build records `git rev-list --count
          # HEAD` as the revision, which a shallow clone reports as 1. The files are what make the
          # repository 3 GB, not the history.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install ant, a virtual display, software OpenGL, a screenshot tool and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ant xvfb imagemagick libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 python3-pil

      - name: Build
        run: ant clean jar

      - name: Package
        run: release/package-app.sh linux

      - name: Launch the package and screenshot
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            extra/launch-shot.sh linux-pkg pkg-out/HFStudio/bin/HFStudio -load "$PWD/$FITS" -load "$PWD/$JP2"

      - name: Judge
        if: always()
        run: extra/launch-judge.sh app-linux-pkg.log alive-linux-pkg.txt app-linux-pkg.out

      - name: Did the image draw
        run: python3 extra/launch-pixels.py shot-linux-pkg.png 1500

      # The JPEG 2000 file must have been decoded by the copy the package carries, which AppInit
      # unpacks under the app's own folder, not by one the runner happens to have.
      - name: Did the bundled JPEG 2000 decoder load
        run: |
          grep -E 'OpenJPEG .* loaded from .*HFStudio' app-linux-pkg.log \
            || { echo "::error::no JPEG 2000 file was decoded by the bundled OpenJPEG"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-linux-evidence
          path: |
            shot-linux-pkg.png
            app-linux-pkg.log
            app-linux-pkg.out

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: HFStudio-*-linux.tar.gz
          compression-level: 0   # already compressed
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install ant and Pillow
        run: |
          choco install -y ant --no-progress
          python -m pip install --quiet pillow

      # As in launch.yml: at the runner's 1024x768 the image is a 30-pixel strip.
      - name: Raise the screen to 1920x1080
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class Res {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency,
                         dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2,
                         dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll")] public static extern int EnumDisplaySettings(string d, int m, ref DEVMODE dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int f);
          }
          "@
          $dm = New-Object Res+DEVMODE
          $dm.dmSize = [Runtime.InteropServices.Marshal]::SizeOf($dm)
          [Res]::EnumDisplaySettings($null, -1, [ref]$dm) | Out-Null
          $dm.dmPelsWidth = 1920; $dm.dmPelsHeight = 1080; $dm.dmFields = 0x180000
          "ChangeDisplaySettings returned $([Res]::ChangeDisplaySettings([ref]$dm, 0)) (0 is success)"

      - name: Build
        shell: bash
        run: ant clean jar

      - name: Package
        shell: bash
        run: release/package-app.sh windows

      - name: Launch the package and screenshot
        shell: bash
        run: |
          extra/launch-shot.sh windows-pkg pkg-out/HFStudio/HFStudio.exe \
            -load "$(cygpath -w "$PWD/$FITS")" -load "$(cygpath -w "$PWD/$JP2")"

      - name: Judge
        if: always()
        shell: bash
        run: extra/launch-judge.sh app-windows-pkg.log alive-windows-pkg.txt app-windows-pkg.out

      - name: Did the image draw
        shell: bash
        run: python extra/launch-pixels.py shot-windows-pkg.png 1500

      # The JPEG 2000 file must have been decoded by the copy the package carries, which AppInit
      # unpacks under the app's own folder, not by one the runner happens to have.
      - name: Did the bundled JPEG 2000 decoder load
        shell: bash
        run: |
          grep -E 'OpenJPEG .* loaded from .*HFStudio' app-windows-pkg.log \
            || { echo "::error::no JPEG 2000 file was decoded by the bundled OpenJPEG"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-windows-evidence
          path: |
            shot-windows-pkg.png
            app-windows-pkg.log
            app-windows-pkg.out

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: HFStudio-*-windows.zip
          compression-level: 0
          retention-days: 14

  # The Intel Mac build, started on an Intel Mac. Not a package anyone downloads: the Intel dmg
  # is built and signed on the Mac by `MAC_ARCH=x64 deploy_release.sh notarize`, which stages it
  # the same way, so this builds that bundle unsigned and starts it. It does not gate the attach
  # job, which only handles the two packages CI builds itself.
  macos-intel:
    runs-on: macos-26-intel   # the longest-lived Intel label; see checks.yml
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install ant and Pillow
        run: |
          brew install ant
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow

      - name: Build
        run: ant clean jar

      - name: Package (unsigned app bundle)
        run: release/package-app.sh macos-x64

      # ANGLE draws through Metal on a Mac, so say what graphics device this runner offers. Measured
      # 2026-09-19: an "Apple Paravirtualized Graphics Device" with Metal but without the mac2 GPU
      # family (common1 and common2 only), on which ANGLE's Metal display will not initialise:
      # eglGetPlatformDisplay fails, although the same Intel ANGLE draws fine under Rosetta on an
      # Apple Silicon Mac. So the graphics checks run only when the device has mac2, and switch
      # back on by themselves if the runner ever gets one.
      - name: What graphics does this runner have
        run: |
          system_profiler SPDisplaysDataType | grep -iE 'chipset|model|vendor|metal|vram|resolution|display type' || true
          swift -e 'import Metal
          if let d = MTLCreateSystemDefaultDevice() {
            print("Metal device:", d.name)
            for (n, f) in [("mac2", MTLGPUFamily.mac2), ("common1", .common1), ("common2", .common2), ("common3", .common3), ("metal3", .metal3)] { print("  supports \(n):", d.supportsFamily(f)) }
          } else { print("Metal device: none") }' 2>&1 | tail -8 | tee metal.txt || true
          if grep -q 'supports mac2: true' metal.txt; then echo "HAS_MAC2=true" >> "$GITHUB_ENV"; else echo "HAS_MAC2=false" >> "$GITHUB_ENV"; fi

      - name: Launch the bundle and screenshot
        run: |
          extra/launch-shot.sh macos-intel pkg-out/HFStudio.app/Contents/MacOS/HFStudio \
            -load "$PWD/$FITS" -load "$PWD/$JP2"

      - name: Judge
        if: always() && env.HAS_MAC2 == 'true'
        run: extra/launch-judge.sh app-macos-intel.log alive-macos-intel.txt app-macos-intel.out

      # Without mac2, everything short of drawing: it started as Intel code, reached its main
      # window, and its one SEVERE is the known display failure. Anything else still fails here.
      - name: Judge what this runner can show
        if: always() && env.HAS_MAC2 != 'true'
        run: |
          L=app-macos-intel.log; fail=0
          grep -q 'loadVersion.*x86_64' "$L" || { echo "FAIL did not run as Intel (x86_64) code"; fail=1; }
          grep -q 'Start main window' "$L"   || { echo "FAIL main window never started"; fail=1; }
          other=$(grep -A1 SEVERE "$L" | grep -vE 'SEVERE|eglGetPlatformDisplay failed|^--$' || true)
          [ -z "$other" ] || { echo "FAIL a SEVERE other than the known display failure:"; echo "$other"; fail=1; }
          grep -E 'loadVersion|Start main window' "$L" | cut -c1-200
          [ $fail = 0 ] && echo "PASS as far as a runner without mac2 Metal can show; graphics untested here"
          exit $fail
      - name: Did the bundled JPEG 2000 decoder load
        run: |
          grep -E 'OpenJPEG .* loaded from .*HFStudio' app-macos-intel.log \
            || { echo "::error::no JPEG 2000 file was decoded by the bundled OpenJPEG"; exit 1; }

      # The whole screen is captured, so a desktop background counts too; revisit the threshold
      # with a screenshot in hand if this ever runs on a runner with mac2.
      - name: Did the image draw
        if: env.HAS_MAC2 == 'true'
        run: python3 extra/launch-pixels.py shot-macos-intel.png 1500

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-macos-intel-evidence
          path: |
            shot-macos-intel.png
            app-macos-intel.log
            app-macos-intel.out

  attach:
    needs: [linux, windows]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # to upload release assets
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*   # the two packages, plus their evidence, which is harmless here
          merge-multiple: true

      # The packages' names come from VERSION at the commit that was built. On a release event
      # that is the tag's commit, so the names must carry the tag's version: packages from any
      # other version are refused rather than attached to the wrong release. A suffix after the
      # version is allowed so a test draft (v0.8.2-attach-test) can be used.
      - name: Check the packages belong to this release
        run: |
          ls -l HFStudio-*
          VERSION="${TAG#v}"; VERSION="${VERSION%%-*}"
          for f in "HFStudio-$VERSION-windows.zip" "HFStudio-$VERSION-linux.tar.gz"; do
            [ -f "$f" ] || { echo "::error::expected $f for $TAG; the build produced $(ls HFStudio-* | tr '\n' ' ')"; exit 1; }
          done

      # Never --clobber: a release's files are fixed once published, and replacing one is how a
      # collaborator loses the build that worked for them. A second run fails here instead.
      - name: Attach to the release
        run: |
          gh release upload "$TAG" HFStudio-*-windows.zip HFStudio-*-linux.tar.gz --repo "$GITHUB_REPOSITORY"

      # The notes are written before these files exist, so their checksums are added now, in the
      # same form the Mac files' checksums take.
      - name: Add the checksums to the release notes
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "Windows and Linux packages, added by the build service from commit ${GITHUB_SHA:0:9}:"
            echo '```'
            sha256sum HFStudio-*-windows.zip HFStudio-*-linux.tar.gz | sed 's/^/sha256  /'
            echo '```'
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name)  \(.size)"'
