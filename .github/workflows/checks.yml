name: checks

# The self-checks in extra/test, run on Linux, Windows and macOS, plus the whole offline gate
# (ant check-all, strict) on Linux, Error Prone, and the repository guards.
#
# This exists because nothing had ever run the JPEG 2000 decoder outside macOS. Since Kakadu
# went, decoding is OpenJPEG called through the foreign function interface, and the libraries
# we ship for both are amd64: an Apple Silicon Mac cannot exercise them at all, under a VM or
# otherwise. A runner can, natively and for free.
#
# One thing a green Windows run does NOT prove: that openjp2.dll loads on a user's machine.
# Runners carry the Visual C++ runtime and a bare Windows install may not, so the README's
# warning about it stands whatever this job says.
#
# Setup (Temurin 25, ant, the natives we ship) is one composite action:
# .github/actions/setup-hfstudio. Third-party actions are pinned by full SHA with a version
# comment; Dependabot (.github/dependabot.yml) proposes the bumps.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Full history, but only this commit's files: guards.py diffs against origin/master. The
      # files are what make the repository about 3 GB, not the history.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none

      # xvfb for the HeadlessException retry in run-checks.sh; glslang-tools for the shaders step;
      # python3-pil and python3-numpy for the ANGLE updater's tests; python3-jsonschema for the hfrecord step,
      # python3-astropy for its reading of the Send to Python FITS files (strict: it fails without astropy).
      # LD_LIBRARY_PATH points at the natives we ship.
      - uses: ./.github/actions/setup-hfstudio
        with:
          linux-packages: xvfb glslang-tools python3-pil python3-numpy python3-jsonschema python3-astropy

      # The whole gate, strict: a check that prints SKIP fails here unless extra/test/ci-skips.txt
      # names it with a reason. ruff and the manual's Sphinx come from pip because the image does not carry them.
      - name: Run ant check-all (strict)
        env:
          CHECKS_STRICT: '1'
        run: |
          python3 -m pip install --quiet --user ruff -r manual/requirements.txt
          xvfb-run -a ant check-all

      # Kept for one release beside the strict gate: OpenJpegDecodeCheck and JpipRebuildCheck exit 0
      # and print SKIPPED when OpenJPEG will not load, so name the shipped library outright here.
      - name: Prove the decoder actually ran
        run: |
          CP="bin:extra/test-classes:resources:$(find lib -name '*.jar' | tr '\n' ':')"
          java -Djhv.openjpeg="$PWD/natives/libopenjp2.so" -cp "$CP" \
               org.helioviewer.jhv.view.j2k.opj.OpenJpegDecodeCheck | tee decode.log
          if grep -q SKIPPED decode.log; then
            echo "::error::OpenJPEG did not load, so the decode check skipped itself"
            exit 1
          fi

  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-hfstudio

      # bash rather than PowerShell because ant runs extra/run-checks.sh through <exec
      # executable="sh">, and sh is only on PATH inside Git Bash.
      - name: Run the checks
        shell: bash
        run: ant test

      # The only step that can tell a working DLL apart from a missing Visual C++ runtime, because
      # the check itself treats both as a skip and exits zero. Semicolons because a Windows JVM
      # wants them in a classpath.
      - name: Prove the decoder actually ran
        shell: bash
        run: |
          CP="bin;extra/test-classes;resources;$(find lib -name '*.jar' | tr '\n' ';')"
          java -Djhv.openjpeg="$(pwd -W)/natives/openjp2.dll" -cp "$CP" \
               org.helioviewer.jhv.view.j2k.opj.OpenJpegDecodeCheck | tee decode.log
          if grep -q SKIPPED decode.log; then
            echo "::error::OpenJPEG did not load, which on Windows usually means the Visual C++ runtime is missing"
            exit 1
          fi

  # macOS was left out at first on the grounds that it is tested by hand every day. That was wrong
  # in one specific way: OpenJpeg.lookup() prefers /opt/homebrew/opt/openjpeg before anything else,
  # so a local run links Homebrew's copy and the dylib that actually ships in the dmg is never
  # exercised. These jobs name the shipped one outright. The setup action picks the natives jar
  # from runner.arch.
  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-hfstudio

      # This also compiles native/macos/jhv_metal_host.m, which nothing off a Mac ever builds.
      - name: Run the checks
        run: ant test

      # -Djhv.openjpeg rather than a search path: a runner carrying Homebrew's openjpeg would
      # otherwise shadow ours silently, which is the exact trap that hid this gap on the laptop.
      - name: Prove the decoder actually ran
        run: |
          CP="bin:extra/test-classes:resources:$(find lib -name '*.jar' | tr '\n' ':')"
          java -Djhv.openjpeg="$PWD/natives/libopenjp2.dylib" -cp "$CP" \
               org.helioviewer.jhv.view.j2k.opj.OpenJpegDecodeCheck | tee decode.log
          if grep -q SKIPPED decode.log; then
            echo "::error::OpenJPEG did not load from the dylib we ship"
            exit 1
          fi

  # Decides whether a pull request needs the Intel Mac job. It takes about 10 minutes against 3
  # to 4 for every other job (measured: queue time is about 3 seconds, the runner is just slow),
  # and an Intel Mac differs from the Apple Silicon one only in the amd64 natives we ship. So a
  # pull request runs it only when it touches natives, the OpenJPEG or Metal code, the setup
  # action or this workflow. Pushes to master and manual runs always run it.
  intel-needed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "$files"
          if echo "$files" | grep -Eiq '^(native/|lib/jhv/|build\.xml$|extra/run-checks\.sh$|\.github/(workflows/checks\.yml|actions/))|(openjp|opj|metal|natives)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No native-facing change, so the Intel Mac job is skipped on this pull request."
          fi

  # Intel is here because an Apple Silicon Mac cannot run jhv-natives-macos.jar at all, and we
  # ship it. macos-13 was retired and a job asking for it queues silently rather than failing, so
  # it sat five hours without starting. macOS 26 is the last release Apple ships for Intel, so
  # this is the longest-lived x64 label there will be. Not -large: that suffix is a paid larger
  # runner. Not a required check: it is slow, so a skipped or red run here does not block a merge.
  macos-x64:
    needs: intel-needed
    if: needs.intel-needed.outputs.run == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-hfstudio

      - name: Run the checks
        run: ant test

      - name: Prove the decoder actually ran
        run: |
          CP="bin:extra/test-classes:resources:$(find lib -name '*.jar' | tr '\n' ':')"
          java -Djhv.openjpeg="$PWD/natives/libopenjp2.dylib" -cp "$CP" \
               org.helioviewer.jhv.view.j2k.opj.OpenJpegDecodeCheck | tee decode.log
          if grep -q SKIPPED decode.log; then
            echo "::error::OpenJPEG did not load from the dylib we ship"
            exit 1
          fi

  # Error Prone 2.50.0 (ant prone, 7 checks off in build.xml). Informational until a baseline of
  # its upstream warnings is recorded; a red run here does not fail the workflow.
  prone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-hfstudio
        with:
          natives: 'false'
          linux-packages: ''

      - name: Error Prone
        run: ant prone

  # The repository guards alone, fast and without a Java build, so a frozen identifier, an added
  # em dash or a new --clobber shows as its own red line.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Guards
        run: |
          python3 extra/ci/guards.py diff --base origin/master
          python3 extra/ci/guards.py count
