name: helioradial-diag

# Diagnostic for the helioradial imagery that draws black on Windows (Gilly, 2026-11-03): exports
# the bundled AIA 171 sample in HPC (control), Helioradial and Helioradial Unrolled, once plainly
# and once per HFS_DEBUG_WARP stage (GLSLShader, imageCommon.frag sampleWarpedHpcColor), on the
# Windows runner (ANGLE D3D11). The step log prints one line per
# picture (extra/tools/helioradial_diag.py summary); the pictures are the artifact.

on:
  pull_request:
    paths:
      - resources/glsl/**
      - src/org/helioviewer/jhv/opengl/**
      - extra/tools/helioradial_diag.py
      - .github/workflows/helioradial-diag.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: resources/samples/aia_171_20120831T173411_1024.fits

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-hfstudio
        with:
          natives: 'false'
          pillow: 'true'

      - name: Raise the screen to 1920x1080
        shell: pwsh
        run: ./extra/ci/set-resolution.ps1

      - name: Build
        shell: bash
        run: ant jar

      - name: Export the stages
        shell: bash
        run: |
          python -m pip install --quiet jsonschema
          OUT="$RUNNER_TEMP/diag"; mkdir -p "$OUT"
          export JAVA_TOOL_OPTIONS="-Duser.home=$(cygpath -w "$RUNNER_TEMP")\\home-diag"
          W() { cygpath -w "$1"; }
          cmd //c "run.bat --export png --out $(W "$OUT/base.png") -load $(W "$PWD/$IMAGE")" || echo "base export exit $?"
          python extra/test/hfrecord_roundtrip.py prepare "$OUT/base.png" "$(cygpath -w "$RUNNER_TEMP")\\home-diag" "$OUT/base.jhv"
          python extra/tools/helioradial_diag.py sessions "$OUT/base.jhv" "$OUT"
          for mode in HPC Helioradial HelioradialUnrolled; do
            for stage in 0 1 2 3 4 5 6; do
              [ "$mode" = HPC ] && [ "$stage" != 0 ] && continue
              if [ "$stage" = 0 ]; then unset HFS_DEBUG_WARP; else export HFS_DEBUG_WARP=$stage; fi
              cmd //c "run.bat --export png --out $(W "$OUT/$mode-$stage.png") -state $(W "$OUT/$mode.jhv")" > "$OUT/$mode-$stage.out" 2>&1 || echo "$mode stage $stage exit $?"
            done
          done
          unset HFS_DEBUG_WARP
          grep -h "OpenGL context" "$RUNNER_TEMP"/home-diag/HFStudio/Logs/*.log | tail -1 || true
          python extra/tools/helioradial_diag.py summary "$OUT"/*.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: helioradial-diag-windows
          path: ${{ runner.temp }}/diag
