name: helioradial-diag

# Diagnostic for the helioradial imagery that draws black on Windows (Gilly, 2026-11-03): exports
# the bundled AIA 171 sample in HPC (control), Helioradial and Helioradial Unrolled, once plainly
# and once per HFS_DEBUG_WARP stage (GLSLShader, imageCommon.frag sampleWarpedHpcColor), on the
# Windows runner (ANGLE D3D11). The step log prints one line per
# picture (extra/tools/helioradial_diag.py summary); the pictures are the artifact.

on:
  pull_request:
    paths:
      - resources/glsl/**
      - src/org/helioviewer/jhv/opengl/**
      - extra/tools/helioradial_diag.py
      - .github/workflows/helioradial-diag.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: resources/samples/aia_171_20120831T173411_1024.fits

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-hfstudio
        with:
          natives: 'false'
          pillow: 'true'

      - name: Raise the screen to 1920x1080
        shell: pwsh
        run: ./extra/ci/set-resolution.ps1

      - name: Build
        shell: bash
        run: ant jar

      - name: Export the stages
        shell: bash
        run: |
          python -m pip install --quiet jsonschema
          OUT="$RUNNER_TEMP/diag"; mkdir -p "$OUT"
          # Run 41780821968 drew no imagery in any mode, Orthographic included (gold=0), after the
          # default 3 s settle; give the software renderer 20 s before the shot.
          export JAVA_TOOL_OPTIONS="-Duser.home=$(cygpath -w "$RUNNER_TEMP")\\home-diag -Djhv.exportSettleMs=20000"
          W() { cygpath -w "$1"; }
          cmd //c "run.bat --export png --out $(W "$OUT/base.png") -load $(W "$PWD/$IMAGE")" || echo "base export exit $?"
          python extra/test/hfrecord_roundtrip.py prepare "$OUT/base.png" "$(cygpath -w "$RUNNER_TEMP")\\home-diag" "$OUT/base.jhv"
          python extra/tools/helioradial_diag.py sessions "$OUT/base.jhv" "$OUT"
          cp "$OUT/base.jhv" "$OUT/Orthographic.jhv"
          LOGS="$RUNNER_TEMP/home-diag/HFStudio/Logs"
          # Each picture's summary prints as soon as it exists, so a job timeout keeps the results.
          # One export may hang (the first run's HPC export never exited); cap each and show why.
          for mode in Orthographic HPC Helioradial HelioradialUnrolled; do
            for stage in 0 7 1 8 9 2 3 4 5 6; do
              case "$mode" in Orthographic|HPC) [ "$stage" != 0 ] && continue ;; esac
              if [ "$stage" = 0 ]; then unset HFS_DEBUG_WARP; else export HFS_DEBUG_WARP=$stage; fi
              rc=0
              timeout 150 cmd //c "run.bat --export png --out $(W "$OUT/$mode-$stage.png") -state $(W "$OUT/$mode.jhv")" > "$OUT/$mode-$stage.out" 2>&1 || rc=$?
              echo "== $mode stage $stage: exit $rc"
              if [ "$rc" != 0 ]; then
                tail -n 25 "$OUT/$mode-$stage.out"
                taskkill //F //IM java.exe > /dev/null 2>&1 || true
              elif [ -f "$OUT/$mode-$stage.png" ]; then
                python extra/tools/helioradial_diag.py summary "$OUT/$mode-$stage.png" || true
              fi
            done
          done
          unset HFS_DEBUG_WARP
          grep -h "OpenGL context" "$LOGS"/*.log | tail -1 || true
          grep -h "SEVERE\|Skipping\|GLException" "$LOGS"/*.log | sort -u | head -40 || true
          python extra/tools/helioradial_diag.py summary "$OUT"/*.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: helioradial-diag-windows
          path: ${{ runner.temp }}/diag
