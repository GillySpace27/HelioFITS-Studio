name: Set up HelioFITS Studio
description: >-
  Temurin 25 and ant for this runner's OS, optional extra packages, and (by default) the
  natives HelioFITS Studio ships, unpacked to ./natives and put where the loader looks.
  Call it after actions/checkout. No input is required.

inputs:
  natives:
    description: "'true' unpacks lib/jhv/jhv-natives-<os>.jar into ./natives for the loader"
    required: false
    default: 'true'
  linux-packages:
    description: Extra apt packages on Linux, installed with ant
    required: false
    default: 'xvfb'
  pillow:
    description: "'true' installs Pillow with pip on Windows and macOS (Linux: add python3-pil to linux-packages)"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: '25'   # build.xml compiles with release="25"

    - name: Install ant (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ant ${{ inputs.linux-packages }}

    - name: Install ant (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: choco install -y ant --no-progress

    - name: Install ant (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ant

    - name: Install Pillow (Windows)
      if: inputs.pillow == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: python -m pip install --quiet pillow

    - name: Install Pillow (macOS)
      if: inputs.pillow == 'true' && runner.os == 'macOS'
      shell: bash
      run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow

    # OpenJpeg.lookup() knows only macOS paths by default, so on Linux it falls through to
    # dlopen("libopenjp2.so"): put the natives we ship on the loader's path so checks exercise
    # our binary, not Debian's OpenJPEG or nothing at all.
    - name: Unpack the Linux natives we ship
      if: inputs.natives == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p natives
        unzip -j -o lib/jhv/jhv-natives-linux.jar 'jhv/linux-amd64/*' -d natives
        ls -l natives
        echo "LD_LIBRARY_PATH=$PWD/natives" >> "$GITHUB_ENV"

    # Windows resolves a bare DLL name through PATH; pwd -W because GITHUB_PATH wants a Windows path.
    - name: Unpack the Windows natives we ship
      if: inputs.natives == 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p natives
        unzip -j -o lib/jhv/jhv-natives-windows.jar 'jhv/windows-amd64/*' -d natives
        ls -l natives
        echo "$(pwd -W)/natives" >> "$GITHUB_PATH"

    # Named outright by the checks with -Djhv.openjpeg, so nothing goes on a search path here.
    - name: Unpack the macOS natives we ship
      if: inputs.natives == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        if [ "${{ runner.arch }}" = ARM64 ]; then
          jar=jhv-natives-macos-arm64.jar; entry='jhv/macos-arm64/*'
        else
          jar=jhv-natives-macos.jar; entry='jhv/macos-amd64/*'
        fi
        mkdir -p natives
        unzip -j -o "lib/jhv/$jar" "$entry" -d natives
        ls -l natives
